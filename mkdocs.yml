site_name: matia-python-client
site_description: An idiomatic, fluent Python client for the Matia API
repo_name: matia-python-client
repo_url: https://github.com/nloding/matia-python-client

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            merge_init_into_class: true
            show_root_heading: true
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - API Reference:
      - Client: reference/client.md
      - Assets: reference/assets.md
      - Integrations: reference/integrations.md
      - Tags: reference/tags.md
      - Users: reference/users.md
      - Audit Logs: reference/audit_logs.md
      - Exceptions: reference/exceptions.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
