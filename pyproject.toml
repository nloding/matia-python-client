[tool.poetry]
name = "matia-client"
version = "1.0.0a1"
description = "An idiomatic, fluent Python client for the Matia API"
authors = ["Matia"]
license = "MIT"
readme = "README.md"
packages = [{ include = "matia" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[tool.poetry.urls]
Repository = "https://github.com/nloding/matia-python-client"
Homepage = "https://github.com/nloding/matia-python-client"

[tool.poetry.dependencies]
python = "^3.9"
httpx = "^0.27"
pydantic = "^2.7"
eval-type-backport = { version = "^0.2.0", python = "<3.10" }

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
respx = "^0.21"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6"
mkdocs-material = "^9.5"
mkdocstrings = { extras = ["python"], version = "^1.0", python = ">=3.10" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
